# Eris — user configuration (applies to BOTH halves).
# Preserved from the original single-half config.

CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_BT_DEVICE_NAME="Eris"
CONFIG_ZMK_SLEEP=n

# Optional: report the right half's battery level to the host through the
# left half. Off by default to keep power usage minimal.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
